<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OCTOPUS — Админка</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
html, body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px 40px;
      background: #0b0d0c;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #888;
      margin: 4px 0 24px;
      font-size: 14px;
    }

    .status {
      background: #151816;
      border: 1px solid #242925;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 18px;
      color: #aaa;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
    }

    .tab {
      flex: 1;
      min-width: 105px;
      border: 1px solid #292d2a;
      background: #151816;
      color: #aaa;
      padding: 12px 10px;
      border-radius: 12px;
      font-size: 14px;
    }

    .tab.active {
      background: #f5f5f5;
      color: #0b0d0c;
      border-color: #f5f5f5;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      background: #151816;
      border: 1px solid #242925;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .name {
      font-size: 16px;
      font-weight: 700;
    }

    .muted {
      color: #888;
      font-size: 13px;
      margin-top: 5px;
    }

    .price {
      font-weight: 700;
      white-space: nowrap;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .primary {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      background: #f5f5f5;
      color: #0b0d0c;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .secondary {
      padding: 9px 12px;
      border-radius: 10px;
      background: #252925;
      color: #fff;
      font-size: 13px;
    }

    .danger {
      padding: 9px 12px;
      border-radius: 10px;
      background: #351b1b;
      color: #ff8585;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #292d2a;
      border-radius: 11px;
      background: #0f1210;
      color: #fff;
      outline: none;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .file-label { display:block; color:#aaa; font-size:13px; margin:2px 0 8px; }
    .image-preview-wrap { margin:2px 0 14px; border-radius:14px; overflow:hidden; border:1px solid #292d2a; background:#0f1210; }
    .image-preview { width:100%; aspect-ratio:1; object-fit:cover; display:block; }

    .form-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: #ff7777;
      white-space: pre-wrap;
      margin-top: 12px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }
  </style>

<script>
(function () {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (event) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
    document.addEventListener(eventName, function (event) {
      event.preventDefault();
    }, { passive: false });
  });
})();
</script>
</head>

<body>

  <div class="logo">OCTOPUS</div>
  <div class="subtitle">Панель администратора</div>

  <div id="status" class="status">
    Проверяем доступ...
  </div>

  <div id="app" class="hidden">

    <div class="tabs">
      <button class="tab active" onclick="showTab('products', this)">
        Товары
      </button>

      <button class="tab" onclick="showTab('categories', this)">
        Категории
      </button>

      <button class="tab" onclick="showTab('variants', this)">
        Варианты
      </button>
    </div>


    <!-- ТОВАРЫ -->

    <section id="products" class="section active">

      <button class="primary" onclick="openProductForm()">
        + Добавить товар
      </button>

      <div id="productsList"></div>

    </section>


    <!-- КАТЕГОРИИ -->

    <section id="categories" class="section">

      <button class="primary" onclick="openCategoryForm()">
        + Добавить категорию
      </button>

      <div id="categoriesList"></div>

    </section>


    <!-- ВАРИАНТЫ -->

    <section id="variants" class="section">

      <div class="card">

        <div class="form-title">
          Выберите товар
        </div>

        <select id="variantProduct"
                onchange="loadVariants()">

          <option value="">
            Выберите товар
          </option>

        </select>

      </div>

      <div id="variantsContent"></div>

    </section>


    <!-- ФОРМА ТОВАРА -->

    <section id="productForm" class="section">

      <div class="card">

        <div class="form-title">
          Товар
        </div>

        <input
          id="productName"
          placeholder="Название"
        >

        <input
          id="productPrice"
          type="number"
          placeholder="Цена"
        >

        <input
          id="productSortOrder"
          type="number"
          placeholder="Порядок в каталоге (0, 1, 2...)"
          value="0"
        >

        <select id="productCategory">
          <option value="">
            Категория
          </option>
        </select>

        <label class="file-label" for="productImageFile">Фото товара</label>

        <input id="productImageFile" type="file" accept="image/*" onchange="previewProductImage(event)">

        <div id="productImagePreviewWrap" class="image-preview-wrap hidden">
          <img id="productImagePreview" class="image-preview" alt="Предпросмотр">
        </div>

        <textarea
          id="productDescription"
          placeholder="Описание"
        ></textarea>

        <div class="form-title" style="margin-top:18px;">Вкусы</div>
        <div id="productVariantsEditor"></div>

        <button
          class="secondary"
          type="button"
          onclick="addProductVariantDraft()"
          style="width:100%;margin-bottom:14px;"
        >
          + Добавить вкус
        </button>

        <button
          class="primary"
          onclick="saveProduct()"
        >
          Сохранить товар
        </button>

        <button
          class="secondary"
          onclick="backToProducts()"
        >
          Отмена
        </button>

      </div>

    </section>


    <!-- ФОРМА КАТЕГОРИИ -->

    <section id="categoryForm" class="section">

      <div class="card">

        <div class="form-title">
          Категория
        </div>

        <input
          id="categoryName"
          placeholder="Название категории"
        >

        <input
          id="categoryImage"
          placeholder="Ссылка на изображение"
        >

        <input
          id="categorySortOrder"
          type="number"
          placeholder="Порядок (0, 1, 2...)"
          value="0"
        >

        <button
          class="primary"
          onclick="saveCategory()"
        >
          Сохранить категорию
        </button>

        <button
          class="secondary"
          onclick="backToCategories()"
        >
          Отмена
        </button>

      </div>

    </section>

  </div>

  <div id="error" class="error"></div>


<script>

const SUPABASE_URL =
  "https://fhnryfjpkbszbulxaytg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OLxJGrlszfH6lhJrGcpocg_6Knr1yow";

const API_URL =
  SUPABASE_URL + "/functions/v1/admin-api";

let initData = "";
let products = [];
let categories = [];
let productVariantsDraft = [];
let deletedVariantIds = [];


/* -------------------------
   TELEGRAM
------------------------- */

async function start() {

  try {

    if (!window.Telegram ||
        !Telegram.WebApp) {

      throw new Error(
        "Откройте админку внутри Telegram."
      );
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    initData =
      Telegram.WebApp.initData;

    if (!initData) {

      throw new Error(
        "Telegram не передал данные авторизации."
      );
    }

    const result =
      await api("categories.list");

    if (!result.ok) {
      throw new Error(result.error);
    }

    document
      .getElementById("status")
      .textContent =
      "Доступ разрешён";

    document
      .getElementById("app")
      .classList.remove("hidden");

    await loadCategories();
    await loadProducts();

  } catch (error) {

    document
      .getElementById("status")
      .textContent =
      "Ошибка доступа";

    document
      .getElementById("error")
      .textContent =
      error.message || String(error);
  }
}


/* -------------------------
   API
------------------------- */

async function api(action, payload = {}) {

  const response =
    await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },

      body: JSON.stringify({

        initData,
        action,
        payload

      })

    });


  const text =
    await response.text();

  let data;

  try {

    data = JSON.parse(text);

  } catch {

    throw new Error(
      "Сервер вернул неожиданный ответ:\n" +
      text
    );

  }


  if (!response.ok || !data.ok) {

    throw new Error(
      data.error ||
      "Ошибка API"
    );

  }

  return data;
}


/* -------------------------
   TABS
------------------------- */

function showTab(name, button) {

  document
    .querySelectorAll(".section")
    .forEach(x =>
      x.classList.remove("active")
    );

  document
    .querySelectorAll(".tab")
    .forEach(x =>
      x.classList.remove("active")
    );

  document
    .getElementById(name)
    .classList.add("active");

  if (button) {
    button.classList.add("active");
  }

}


/* -------------------------
   CATEGORIES
------------------------- */

async function loadCategories() {

  const result =
    await api("categories.list");

  categories =
    result.data || [];

  renderCategories();

  fillCategorySelect();

}


function renderCategories() {

  const box =
    document.getElementById(
      "categoriesList"
    );

  if (!categories.length) {

    box.innerHTML =
      '<div class="empty">Категорий пока нет</div>';

    return;
  }


  box.innerHTML =
    categories.map(category => `

      <div class="card">

        <div class="row">

          <div>
            <div class="name">
              ${escapeHtml(category.name)}
            </div>

            <div class="muted">
              ID: ${category.id} · Порядок: ${category.sort_order ?? 0}
            </div>
          </div>

          <button
            class="secondary"
            onclick="editCategory(${category.id})"
          >
            Изменить
          </button>

          <button
            class="danger"
            onclick="deleteCategory(${category.id})"
          >
            Удалить
          </button>

        </div>

      </div>

    `).join("");

}


function fillCategorySelect() {

  const select =
    document.getElementById(
      "productCategory"
    );

  select.innerHTML =
    '<option value="">Категория</option>' +
    categories
      .filter(x => x.is_active)
      .map(x => `
        <option value="${x.id}">
          ${escapeHtml(x.name)}
        </option>
      `)
      .join("");

}


function openCategoryForm() {
  document.getElementById("categoryName").value = "";
  document.getElementById("categoryImage").value = "";
  document.getElementById("categorySortOrder").value = "0";
  document.getElementById("categoryForm").dataset.editId = "";
  document.querySelector("#categoryForm .primary").textContent = "Сохранить категорию";
  hideAllSections();
  document.getElementById("categoryForm").classList.add("active");
}

function editCategory(id) {
  const category = categories.find(x => Number(x.id) === Number(id));
  if (!category) return;
  document.getElementById("categoryName").value = category.name || "";
  document.getElementById("categoryImage").value = category.image_url || "";
  document.getElementById("categorySortOrder").value = category.sort_order ?? 0;
  document.getElementById("categoryForm").dataset.editId = category.id;
  document.querySelector("#categoryForm .primary").textContent = "Сохранить изменения";
  hideAllSections();
  document.getElementById("categoryForm").classList.add("active");
}

async function saveCategory() {
  const form = document.getElementById("categoryForm");
  const editId = form.dataset.editId;
  const name = document.getElementById("categoryName").value.trim();
  const image_url = document.getElementById("categoryImage").value.trim();
  const sort_order = Number(document.getElementById("categorySortOrder").value || 0);

  if (!name) {
    alert("Введите название категории");
    return;
  }

  if (editId) {
    await api("categories.update", { id:Number(editId), name, image_url, sort_order });
  } else {
    await api("categories.create", { name, image_url, sort_order });
  }

  document.getElementById("categoryName").value = "";
  document.getElementById("categoryImage").value = "";
  document.getElementById("categorySortOrder").value = "0";
  form.dataset.editId = "";
  document.querySelector("#categoryForm .primary").textContent = "Сохранить категорию";
  await loadCategories();
  backToCategories();
}


async function deleteCategory(id) {

  if (!confirm("Удалить категорию?")) {
    return;
  }

  await api(
    "categories.delete",
    { id }
  );

  await loadCategories();

}


/* -------------------------
   PRODUCTS
------------------------- */

async function loadProducts() {

  const result =
    await api("products.list");

  products =
    result.data || [];

  renderProducts();

  fillVariantProducts();

}


function renderProducts() {

  const box =
    document.getElementById(
      "productsList"
    );


  if (!products.length) {

    box.innerHTML =
      '<div class="empty">Товаров пока нет</div>';

    return;
  }


  box.innerHTML =
    products.map(product => {

      const category =
        categories.find(
          x =>
            Number(x.id) ===
            Number(product.category_id)
        );


      return `

        <div class="card">

          <div class="row">

            <div>

              <div class="name">
                ${escapeHtml(product.name)}
              </div>

              <div class="muted">
                ${category
                  ? escapeHtml(category.name)
                  : "Без категории"}
                · Порядок: ${product.sort_order ?? 0}
              </div>

            </div>

            <div class="price">
              ${product.price || 0} ₽
            </div>

          </div>


          <div class="actions">

            <button
              class="secondary"
              onclick="editProduct(${product.id})"
            >
              Изменить
            </button>

            <button
              class="danger"
              onclick="deleteProduct(${product.id})"
            >
              Удалить
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function openProductForm() {

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productSortOrder").value = "0";
  document.getElementById("productImageFile").value = "";
  clearProductImagePreview();
  setProductSaveState("Сохранить товар");
  document.getElementById("productDescription").value = "";
  document.getElementById("productCategory").value = "";
  document.getElementById("productForm").dataset.editId = "";
  productVariantsDraft = [];
  deletedVariantIds = [];
  renderProductVariantsEditor();

  hideAllSections();
  document.getElementById("productForm").classList.add("active");
}


async function editProduct(id) {

  const product = products.find(x => Number(x.id) === Number(id));
  if (!product) return;

  document.getElementById("productName").value = product.name || "";
  document.getElementById("productPrice").value = product.price ?? "";
  document.getElementById("productSortOrder").value = product.sort_order ?? 0;
  document.getElementById("productImageFile").value = "";
  showProductImagePreview(product.image_url);
  document.getElementById("productDescription").value = product.description || "";
  document.getElementById("productCategory").value = product.category_id || "";
  document.getElementById("productForm").dataset.editId = product.id;

  try {
    const result = await api("variants.list", { product_id: Number(product.id) });
    productVariantsDraft = (result.data || []).map((v, index) => ({
      id: Number(v.id),
      name: v.name || "",
      price: v.price ?? 0,
      sort_order: v.sort_order ?? index
    }));
  } catch (error) {
    alert("Не удалось загрузить вкусы: " + error.message);
    productVariantsDraft = [];
  }

  deletedVariantIds = [];
  renderProductVariantsEditor();
  hideAllSections();
  document.getElementById("productForm").classList.add("active");
}


async function saveProduct() {

  const form = document.getElementById("productForm");
  const editId = form.dataset.editId;
  const name = document.getElementById("productName").value.trim();
  const price = Number(document.getElementById("productPrice").value || 0);
  const sort_order = Number(document.getElementById("productSortOrder").value || 0);
  const category_id = document.getElementById("productCategory").value;
  const imageFile = document.getElementById("productImageFile").files[0] || null;
  const description = document.getElementById("productDescription").value.trim();

  syncProductVariantsDraft();

  if (!name) {
    alert("Введите название товара");
    return;
  }

  const payload = {
    name,
    price,
    sort_order,
    category_id: category_id ? Number(category_id) : null,
    description
  };

  try {
    let productId;
    if (editId) {
      const result = await api("products.update", { id:Number(editId), ...payload });
      productId = result.data.id;
    } else {
      const result = await api("products.create", payload);
      productId = result.data.id;
    }

    if (imageFile) {
      setProductSaveState("Загружаем фото...");
      const imageUrl = await uploadProductImage(productId, imageFile);
      await api("products.update", { id:Number(productId), image_url:imageUrl });
    }

    setProductSaveState("Сохраняем вкусы...");

    for (let i = 0; i < productVariantsDraft.length; i++) {
      const variant = productVariantsDraft[i];
      const variantPayload = {
        name: String(variant.name || "").trim(),
        price: Number(variant.price || 0),
        sort_order: Number(variant.sort_order ?? i),
        is_active: true
      };
      if (!variantPayload.name) continue;

      if (variant.id) {
        await api("variants.update", { id:Number(variant.id), ...variantPayload });
      } else {
        await api("variants.create", { product_id:Number(productId), ...variantPayload });
      }
    }

    for (const variantId of deletedVariantIds) {
      await api("variants.delete", { id:Number(variantId) });
    }

    await loadProducts();
    backToProducts();
  } catch (error) {
    alert(error.message || String(error));
    setProductSaveState("Сохранить товар");
  }
}

function syncProductVariantsDraft() {
  document.querySelectorAll("#productVariantsEditor .variant-editor-row").forEach((row) => {
    const index = Number(row.dataset.index);
    if (!productVariantsDraft[index]) return;
    productVariantsDraft[index].name = row.querySelector(".variant-editor-name")?.value || "";
    productVariantsDraft[index].price = Number(row.querySelector(".variant-editor-price")?.value || 0);
    productVariantsDraft[index].sort_order = Number(row.querySelector(".variant-editor-order")?.value || index);
  });
}

function renderProductVariantsEditor() {
  const box = document.getElementById("productVariantsEditor");
  if (!box) return;

  if (!productVariantsDraft.length) {
    box.innerHTML = '<div class="muted" style="margin-bottom:12px;">Вкусов пока нет</div>';
    return;
  }

  box.innerHTML = productVariantsDraft.map((variant, index) => `
    <div class="card variant-editor-row" data-index="${index}" style="padding:12px;margin-bottom:8px;">
      <input class="variant-editor-name" value="${escapeHtml(variant.name)}" placeholder="Название вкуса">
      <input class="variant-editor-price" type="number" value="${Number(variant.price || 0)}" placeholder="Цена">
      <input class="variant-editor-order" type="number" value="${Number(variant.sort_order ?? index)}" placeholder="Порядок">
      <button class="danger" type="button" onclick="removeProductVariantDraft(${index})">Удалить вкус</button>
    </div>
  `).join("");
}

function addProductVariantDraft() {
  syncProductVariantsDraft();
  productVariantsDraft.push({ id:null, name:"", price:0, sort_order:productVariantsDraft.length });
  renderProductVariantsEditor();
}

function removeProductVariantDraft(index) {
  syncProductVariantsDraft();
  const variant = productVariantsDraft[index];
  if (variant?.id) deletedVariantIds.push(variant.id);
  productVariantsDraft.splice(index, 1);
  renderProductVariantsEditor();
}


function showProductImagePreview(url) {
  const wrap=document.getElementById("productImagePreviewWrap");
  const img=document.getElementById("productImagePreview");
  if(!url){wrap.classList.add("hidden");img.removeAttribute("src");return;}
  img.src=url; wrap.classList.remove("hidden");
}
function clearProductImagePreview(){showProductImagePreview("");}
function previewProductImage(event){
  const file=event.target.files[0];
  if(!file){clearProductImagePreview();return;}
  if(!file.type.startsWith("image/")){alert("Выберите изображение");event.target.value="";clearProductImagePreview();return;}
  showProductImagePreview(URL.createObjectURL(file));
}
function setProductSaveState(text){const button=document.querySelector("#productForm .primary");if(button)button.textContent=text;}
async function uploadProductImage(productId,file){
  if(file.size>8*1024*1024)throw new Error("Фото слишком большое. Максимум 8 МБ.");
  const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=()=>reject(new Error("Не удалось прочитать фото."));reader.readAsDataURL(file);});
  const result=await api("images.upload",{product_id:Number(productId),file_name:file.name,mime_type:file.type,base64});
  return result.data.image_url;
}

async function deleteProduct(id) {

  if (!confirm("Удалить товар?")) {
    return;
  }


  await api(
    "products.delete",
    { id }
  );


  await loadProducts();

}


/* -------------------------
   VARIANTS
------------------------- */

function fillVariantProducts() {

  const select =
    document.getElementById(
      "variantProduct"
    );


  select.innerHTML =
    '<option value="">Выберите товар</option>' +
    products
      .filter(x => x.is_active)
      .map(x => `
        <option value="${x.id}">
          ${escapeHtml(x.name)}
        </option>
      `)
      .join("");

}


async function loadVariants() {

  const productId =
    document
      .getElementById("variantProduct")
      .value;


  const box =
    document.getElementById(
      "variantsContent"
    );


  if (!productId) {

    box.innerHTML =
      '<div class="empty">Выберите товар</div>';

    return;
  }


  const result =
    await api(
      "variants.list",
      {
        product_id:
          Number(productId)
      }
    );


  const variants =
    result.data || [];


  box.innerHTML = `

    <button
      class="primary"
      onclick="createVariant()"
    >
      + Добавить вариант
    </button>

    ${
      variants.length
      ? variants.map(v => `

        <div class="card">

          <div class="row">

            <div class="name">
              ${escapeHtml(v.name)}
            </div>

            <div class="price">
              ${v.price || 0} ₽
            </div>

          </div>

          <div class="actions">

            <button
              class="danger"
              onclick="deleteVariant(${v.id})"
            >
              Удалить
            </button>

          </div>

        </div>

      `).join("")
      : '<div class="empty">Вариантов пока нет</div>'
    }

  `;

}


async function createVariant() {

  const productId =
    document
      .getElementById("variantProduct")
      .value;


  const name =
    prompt("Название варианта:");

  if (!name) return;


  const price =
    Number(
      prompt("Цена:", "0") || 0
    );


  await api(
    "variants.create",
    {
      product_id:
        Number(productId),
      name,
      price
    }
  );


  await loadVariants();

}


async function deleteVariant(id) {

  if (!confirm("Удалить вариант?")) {
    return;
  }


  await api(
    "variants.delete",
    { id }
  );


  await loadVariants();

}


/* -------------------------
   NAVIGATION
------------------------- */

function hideAllSections() {

  document
    .querySelectorAll(".section")
    .forEach(x =>
      x.classList.remove("active")
    );

}


function backToProducts() {

  hideAllSections();

  document
    .getElementById("products")
    .classList.add("active");

}


function backToCategories() {

  hideAllSections();

  document
    .getElementById("categories")
    .classList.add("active");

}


/* -------------------------
   SECURITY
------------------------- */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}
