<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCTOPUS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  padding: 25px 18px;
  max-width: 700px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
}

.status {
  font-size: 13px;
  color: #777;
}

.online {
  color: #55d98b;
}

.error {
  color: #ff6464;
}

h2 {
  font-size: 25px;
  margin-bottom: 18px;
}

section {
  margin-bottom: 40px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  padding: 12px 17px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 14px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

.category:hover {
  background: #202020;
}

.category.active {
  background: white;
  color: #090909;
  border-color: white;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product {
  background: #151515;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #222;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}

.product:hover {
  transform: translateY(-2px);
  border-color: #444;
}

.product:active {
  transform: scale(0.98);
}

.product img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-info {
  padding: 13px;
}

.product-name {
  font-weight: 700;
}

.product-price {
  color: #999;
  margin-top: 6px;
}

.message {
  padding: 18px;
  border-radius: 15px;
  background: #151515;
  color: #777;
}

#errorBox {
  display: none;
  background: #1b0c0c;
  border: 1px solid #542020;
  color: #ff8b8b;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 25px;
  white-space: pre-wrap;
}

/* Карточка товара */

#productDetails {
  display: none;
}

.back-button {
  display: inline-block;
  padding: 11px 16px;
  margin-bottom: 25px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 13px;
  color: white;
  cursor: pointer;
  user-select: none;
}

.back-button:active {
  transform: scale(0.97);
}

.product-details-card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 22px;
  overflow: hidden;
}

.product-details-image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-details-info {
  padding: 20px;
}

.product-details-name {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 10px;
}

.product-details-price {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
}

.product-details-description {
  color: #aaa;
  line-height: 1.55;
  white-space: pre-wrap;
}

.variants-title {
  font-size: 20px;
  font-weight: 700;
  margin-top: 25px;
  margin-bottom: 12px;
}

.variants {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.variant {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 15px;
  background: #090909;
  border: 1px solid #292929;
  border-radius: 13px;
}

.variant-name {
  font-weight: 600;
}

.variant-price {
  color: #aaa;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">OCTOPUS</div>
  <div id="status" class="status">Подключение...</div>
</header>

<div id="errorBox"></div>


<!-- КАТАЛОГ -->

<div id="catalogView">

  <section>
    <h2>Категории</h2>

    <div id="categories" class="categories">
      <div class="message">Загрузка...</div>
    </div>
  </section>

  <section>
    <h2>Каталог</h2>

    <div id="products" class="products">
      <div class="message">Загрузка товаров...</div>
    </div>
  </section>

</div>


<!-- КАРТОЧКА ТОВАРА -->

<div id="productDetails">

  <div
    class="back-button"
    id="backButton"
  >
    ← Назад к каталогу
  </div>

  <div
    id="productDetailsContent"
    class="product-details-card"
  ></div>

</div>

</div>


<script>

const SUPABASE_URL =
  "https://fhnryfjpkbszbulxaytg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OLxJGrlszfH6lhJrGcpocg_6Knr1yow";


const statusElement =
  document.getElementById("status");

const categoriesElement =
  document.getElementById("categories");

const productsElement =
  document.getElementById("products");

const errorBox =
  document.getElementById("errorBox");

const catalogView =
  document.getElementById("catalogView");

const productDetails =
  document.getElementById("productDetails");

const productDetailsContent =
  document.getElementById("productDetailsContent");

const backButton =
  document.getElementById("backButton");


let allProducts = [];

let currentCategory = null;


/* =========================
   SUPABASE
========================= */

async function supabaseRequest(
  table,
  query = ""
) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 8000);


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      "?" +
      query;


    const response =
      await fetch(url, {

        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        signal: controller.signal

      });


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );

    }


    return await response.json();


  } catch (error) {

    if (
      error.name === "AbortError"
    ) {

      throw new Error(
        "Supabase не ответил за 8 секунд."
      );

    }

    throw error;


  } finally {

    clearTimeout(timeout);

  }

}


/* =========================
   КАТЕГОРИИ
========================= */

async function loadCategories() {

  try {

    const data =
      await supabaseRequest(
        "Categories",
        "select=*&is_active=eq.true&order=sort_order.asc"
      );


    categoriesElement.innerHTML = "";


    if (!data.length) {

      categoriesElement.innerHTML =
        '<div class="message">Категорий пока нет</div>';

      return;

    }


    /* Кнопка ВСЕ */

    const allButton =
      document.createElement("div");

    allButton.className =
      "category active";

    allButton.textContent =
      "Все";


    allButton.addEventListener(
      "click",
      () => {

        currentCategory = null;

        document
          .querySelectorAll(".category")
          .forEach(button => {

            button.classList.remove(
              "active"
            );

          });


        allButton.classList.add(
          "active"
        );


        renderProducts(
          allProducts
        );

      }
    );


    categoriesElement.appendChild(
      allButton
    );


    /* Остальные категории */

    data.forEach(category => {

      const element =
        document.createElement("div");


      element.className =
        "category";


      element.textContent =
        category.name;


      element.addEventListener(
        "click",
        () => {

          currentCategory =
            category.id;


          document
            .querySelectorAll(".category")
            .forEach(button => {

              button.classList.remove(
                "active"
              );

            });


          element.classList.add(
            "active"
          );


          const filteredProducts =
            allProducts.filter(
              product => {

                return String(
                  product.category_id
                ) === String(
                  category.id
                );

              }
            );


          renderProducts(
            filteredProducts
          );

        }
      );


      categoriesElement.appendChild(
        element
      );

    });


  } catch (error) {

    categoriesElement.innerHTML =
      '<div class="message">Не удалось загрузить категории</div>';

    throw error;

  }

}


/* =========================
   ТОВАРЫ
========================= */

async function loadProducts() {

  try {

    const data =
      await supabaseRequest(
        "Products",
        "select=*&is_active=eq.true&order=sort_order.asc"
      );


    allProducts =
      data;


    renderProducts(
      data
    );


  } catch (error) {

    productsElement.innerHTML =
      '<div class="message">Не удалось загрузить каталог</div>';

    throw error;

  }

}


/* =========================
   ОТРИСОВКА ТОВАРОВ
========================= */

function renderProducts(data) {

  productsElement.innerHTML = "";


  if (!data.length) {

    productsElement.innerHTML =
      '<div class="message">В этой категории товаров пока нет</div>';

    return;

  }


  data.forEach(product => {

    const card =
      document.createElement("div");


    card.className =
      "product";


    const image =
      product.image_url
        ? `
          <img
            src="${product.image_url}"
            alt=""
          >
        `
        : "";


    const price =
      product.price
        ? `
          <div class="product-price">
            ${product.price} ₽
          </div>
        `
        : "";


    card.innerHTML = `

      ${image}

      <div class="product-info">

        <div class="product-name">
          ${product.name}
        </div>

        ${price}

      </div>

    `;


    /* КЛИК ПО ТОВАРУ */

    card.addEventListener(
      "click",
      () => {

        openProduct(
          product
        );

      }
    );


    productsElement.appendChild(
      card
    );

  });

}


/* =========================
   ОТКРЫТИЕ ТОВАРА
========================= */

async function openProduct(product) {

  catalogView.style.display =
    "none";

  productDetails.style.display =
    "block";


  productDetailsContent.innerHTML =
    '<div class="message">Загрузка товара...</div>';


  try {

    /* Загружаем варианты товара */

    const variants =
      await supabaseRequest(
        "product_variants",
        "select=*&product_id=eq." +
        encodeURIComponent(product.id) +
        "&is_active=eq.true&order=sort_order.asc"
      );


    const image =
      product.image_url
        ? `
          <img
            class="product-details-image"
            src="${product.image_url}"
            alt=""
          >
        `
        : "";


    const price =
      product.price
        ? `
          <div class="product-details-price">
            ${product.price} ₽
          </div>
        `
        : "";


    const description =
      product.description
        ? `
          <div class="product-details-description">
            ${product.description}
          </div>
        `
        : `
          <div class="product-details-description">
            Описание товара пока не добавлено.
          </div>
        `;


    let variantsHTML = "";


    if (
      variants &&
      variants.length
    ) {

      variantsHTML = `

        <div class="variants-title">
          Варианты
        </div>

        <div class="variants">

          ${variants.map(variant => `

            <div class="variant">

              <div class="variant-name">
                ${variant.name}
              </div>

              ${
                variant.price
                  ? `
                    <div class="variant-price">
                      ${variant.price} ₽
                    </div>
                  `
                  : ""
              }

            </div>

          `).join("")}

        </div>

      `;

    }


    productDetailsContent.innerHTML = `

      ${image}

      <div class="product-details-info">

        <div class="product-details-name">
          ${product.name}
        </div>

        ${price}

        ${description}

        ${variantsHTML}

      </div>

    `;


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);


    productDetailsContent.innerHTML = `

      <div class="product-details-info">

        <div class="product-details-name">
          ${product.name}
        </div>

        ${
          product.price
            ? `
              <div class="product-details-price">
                ${product.price} ₽
              </div>
            `
            : ""
        }

        <div class="product-details-description">
          ${product.description || "Описание товара пока не добавлено."}
        </div>

      </div>

    `;

  }

}


/* =========================
   НАЗАД
========================= */

backButton.addEventListener(
  "click",
  () => {

    productDetails.style.display =
      "none";

    catalogView.style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
);


/* =========================
   ЗАПУСК
========================= */

async function start() {

  try {

    await loadCategories();

    await loadProducts();


    statusElement.textContent =
      "● Online";


    statusElement.className =
      "status online";


  } catch (error) {

    console.error(error);


    statusElement.textContent =
      "Ошибка";


    statusElement.className =
      "status error";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "Не удалось подключиться к базе.\n\n" +
      error.message;

  }

}


start();

</script>

</body>
</html>
