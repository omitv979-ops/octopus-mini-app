<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCTOPUS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  padding: 25px 18px;
  max-width: 700px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
}

.status {
  font-size: 13px;
  color: #777;
}

.online {
  color: #55d98b;
}

.error {
  color: #ff6464;
}

h2 {
  font-size: 25px;
  margin-bottom: 18px;
}

section {
  margin-bottom: 40px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  padding: 12px 17px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 14px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

.category:hover {
  background: #202020;
}

.category.active {
  background: white;
  color: #090909;
  border-color: white;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product {
  background: #151515;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #222;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}

.product:hover {
  transform: translateY(-2px);
  border-color: #444;
}

.product:active {
  transform: scale(0.98);
}

.product img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-info {
  padding: 13px;
}

.product-name {
  font-weight: 700;
}

.product-price {
  color: #999;
  margin-top: 6px;
}

.message {
  padding: 18px;
  border-radius: 15px;
  background: #151515;
  color: #777;
}

#errorBox {
  display: none;
  background: #1b0c0c;
  border: 1px solid #542020;
  color: #ff8b8b;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 25px;
  white-space: pre-wrap;
}


/* =========================
   КНОПКА МОЙ ВЫБОР
========================= */

.selection-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 15px;
  margin-bottom: 20px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 13px;
  color: white;
  cursor: pointer;
  user-select: none;
}

.selection-button:active {
  transform: scale(0.97);
}

.selection-count {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: white;
  color: #090909;
  font-size: 12px;
  font-weight: 800;
}


/* =========================
   КАРТОЧКА ТОВАРА
========================= */

#productDetails {
  display: none;
}

.back-button {
  display: inline-block;
  padding: 11px 16px;
  margin-bottom: 25px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 13px;
  color: white;
  cursor: pointer;
  user-select: none;
}

.back-button:active {
  transform: scale(0.97);
}

.product-details-card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 22px;
  overflow: hidden;
}

.product-details-image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-details-info {
  padding: 20px;
}

.product-details-name {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 10px;
}

.product-details-price {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
}

.product-details-description {
  color: #aaa;
  line-height: 1.55;
  white-space: pre-wrap;
}


/* =========================
   ВАРИАНТЫ
========================= */

.variants-title {
  font-size: 20px;
  font-weight: 700;
  margin-top: 25px;
  margin-bottom: 12px;
}

.variants {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.variant {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 15px;
  background: #090909;
  border: 1px solid #292929;
  border-radius: 13px;
}

.variant-name {
  font-weight: 600;
}

.variant-price {
  color: #aaa;
}


/* =========================
   ДОБАВИТЬ
========================= */

.add-selection-button {
  width: 100%;
  margin-top: 20px;
  padding: 14px 16px;
  background: white;
  color: #090909;
  border: 0;
  border-radius: 13px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
}

.add-selection-button:active {
  transform: scale(0.98);
}


/* =========================
   МОЙ ВЫБОР
========================= */

.selection-view {
  display: none;
}

.selection-item {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 13px;
  margin-bottom: 10px;
  background: #151515;
  border: 1px solid #222;
  border-radius: 16px;
}

.selection-item-image {
  width: 70px;
  height: 70px;
  flex: 0 0 70px;
  border-radius: 12px;
  object-fit: cover;
  background: #090909;
}

.selection-item-info {
  flex: 1;
  min-width: 0;
}

.selection-item-name {
  font-weight: 700;
  margin-bottom: 5px;
}

.selection-item-price {
  color: #999;
  font-size: 14px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
}

.quantity button {
  width: 30px;
  height: 30px;
  border: 1px solid #333;
  border-radius: 9px;
  background: #090909;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.quantity-value {
  min-width: 20px;
  text-align: center;
}

.remove-selection {
  padding: 7px;
  color: #777;
  cursor: pointer;
  font-size: 13px;
}

.selection-empty {
  padding: 25px 18px;
  text-align: center;
  border-radius: 16px;
  background: #151515;
  color: #777;
}

.selection-total {
  margin-top: 18px;
  padding: 18px;
  border-radius: 16px;
  background: #151515;
  border: 1px solid #222;
  display: flex;
  justify-content: space-between;
  font-weight: 800;
}

</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">OCTOPUS</div>
  <div id="status" class="status">Подключение...</div>
</header>

<div id="errorBox"></div>


<!-- МОЙ ВЫБОР -->

<div
  class="selection-button"
  id="selectionButton"
>
  Мой выбор
  <span
    class="selection-count"
    id="selectionCount"
  >
    0
  </span>
</div>


<!-- КАТАЛОГ -->

<div id="catalogView">

  <section>
    <h2>Категории</h2>

    <div
      id="categories"
      class="categories"
    >
      <div class="message">
        Загрузка...
      </div>
    </div>
  </section>


  <section>

    <h2>Каталог</h2>

    <div
      id="products"
      class="products"
    >
      <div class="message">
        Загрузка товаров...
      </div>
    </div>

  </section>

</div>


<!-- КАРТОЧКА ТОВАРА -->

<div id="productDetails">

  <div
    class="back-button"
    id="backButton"
  >
    ← Назад к каталогу
  </div>

  <div
    id="productDetailsContent"
    class="product-details-card"
  ></div>

</div>


<!-- МОЙ ВЫБОР -->

<div
  id="selectionView"
  class="selection-view"
>

  <div
    class="back-button"
    id="backFromSelection"
  >
    ← Назад к каталогу
  </div>

  <h2>Мой выбор</h2>

  <div id="selectionItems"></div>

  <div
    id="selectionTotal"
    class="selection-total"
    style="display:none;"
  >
    <span>Всего</span>

    <span id="selectionTotalValue">
      0 ₽
    </span>

  </div>

</div>


</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://fhnryfjpkbszbulxaytg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OLxJGrlszfH6lhJrGcpocg_6Knr1yow";


/* =========================
   ELEMENTS
========================= */

const statusElement =
  document.getElementById("status");

const categoriesElement =
  document.getElementById("categories");

const productsElement =
  document.getElementById("products");

const errorBox =
  document.getElementById("errorBox");

const catalogView =
  document.getElementById("catalogView");

const productDetails =
  document.getElementById("productDetails");

const productDetailsContent =
  document.getElementById(
    "productDetailsContent"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const selectionButton =
  document.getElementById(
    "selectionButton"
  );

const selectionCount =
  document.getElementById(
    "selectionCount"
  );

const selectionView =
  document.getElementById(
    "selectionView"
  );

const backFromSelection =
  document.getElementById(
    "backFromSelection"
  );

const selectionItems =
  document.getElementById(
    "selectionItems"
  );

const selectionTotal =
  document.getElementById(
    "selectionTotal"
  );

const selectionTotalValue =
  document.getElementById(
    "selectionTotalValue"
  );


/* =========================
   STATE
========================= */

let allProducts = [];

let currentCategory = null;

let selectedItems = [];


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseRequest(
  table,
  query = ""
) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {

      controller.abort();

    }, 8000);


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      "?" +
      query;


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          },

          signal:
            controller.signal

        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );

    }


    return await response.json();


  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      throw new Error(
        "Supabase не ответил за 8 секунд."
      );

    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }

}


/* =========================
   CATEGORIES
========================= */

async function loadCategories() {

  try {

    const data =
      await supabaseRequest(
        "Categories",
        "select=*&is_active=eq.true&order=sort_order.asc"
      );


    categoriesElement.innerHTML =
      "";


    if (!data.length) {

      categoriesElement.innerHTML =
        '<div class="message">Категорий пока нет</div>';

      return;

    }


    /* ВСЕ */

    const allButton =
      document.createElement(
        "div"
      );

    allButton.className =
      "category active";

    allButton.textContent =
      "Все";


    allButton.addEventListener(
      "click",
      () => {

        currentCategory =
          null;


        document
          .querySelectorAll(
            ".category"
          )
          .forEach(
            button => {

              button.classList
                .remove(
                  "active"
                );

            }
          );


        allButton.classList
          .add("active");


        renderProducts(
          allProducts
        );

      }
    );


    categoriesElement
      .appendChild(
        allButton
      );


    /* КАТЕГОРИИ */

    data.forEach(
      category => {

        const element =
          document.createElement(
            "div"
          );


        element.className =
          "category";


        element.textContent =
          category.name;


        element.addEventListener(
          "click",
          () => {

            currentCategory =
              category.id;


            document
              .querySelectorAll(
                ".category"
              )
              .forEach(
                button => {

                  button.classList
                    .remove(
                      "active"
                    );

                }
              );


            element.classList
              .add("active");


            const filteredProducts =
              allProducts.filter(
                product => {

                  return String(
                    product.category_id
                  ) === String(
                    category.id
                  );

                }
              );


            renderProducts(
              filteredProducts
            );

          }
        );


        categoriesElement
          .appendChild(
            element
          );

      }
    );


  } catch (error) {

    categoriesElement.innerHTML =
      '<div class="message">Не удалось загрузить категории</div>';

    throw error;

  }

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

  try {

    const data =
      await supabaseRequest(
        "Products",
        "select=*&is_active=eq.true&order=sort_order.asc"
      );


    allProducts =
      data;


    renderProducts(
      data
    );


  } catch (error) {

    productsElement.innerHTML =
      '<div class="message">Не удалось загрузить каталог</div>';

    throw error;

  }

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(
  data
) {

  productsElement.innerHTML =
    "";


  if (!data.length) {

    productsElement.innerHTML =
      '<div class="message">В этой категории товаров пока нет</div>';

    return;

  }


  data.forEach(
    product => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product";


      const image =
        product.image_url

          ? `
            <img
              src="${product.image_url}"
              alt=""
            >
          `

          : "";


      const price =
        product.price

          ? `
            <div
              class="product-price"
            >
              ${product.price} ₽
            </div>
          `

          : "";


      card.innerHTML = `

        ${image}

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          ${price}

        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          openProduct(
            product
          );

        }
      );


      productsElement
        .appendChild(
          card
        );

    }
  );

}


/* =========================
   OPEN PRODUCT
========================= */

async function openProduct(
  product
) {

  catalogView.style.display =
    "none";

  productDetails.style.display =
    "block";


  productDetailsContent.innerHTML =
    '<div class="message">Загрузка товара...</div>';


  try {

    const variants =
      await supabaseRequest(
        "product_variants",
        "select=*&product_id=eq." +
        encodeURIComponent(
          product.id
        ) +
        "&is_active=eq.true&order=sort_order.asc"
      );


    const image =
      product.image_url

        ? `
          <img
            class="product-details-image"
            src="${product.image_url}"
            alt=""
          >
        `

        : "";


    const price =
      product.price

        ? `
          <div
            class="product-details-price"
          >
            ${product.price} ₽
          </div>
        `

        : "";


    const description =
      product.description

        ? `
          <div
            class="product-details-description"
          >
            ${product.description}
          </div>
        `

        : `
          <div
            class="product-details-description"
          >
            Описание товара пока не добавлено.
          </div>
        `;


    let variantsHTML =
      "";


    if (
      variants &&
      variants.length
    ) {

      variantsHTML = `

        <div class="variants-title">
          Варианты
        </div>

        <div class="variants">

          ${variants
            .map(
              variant => `

                <div
                  class="variant"
                >

                  <div
                    class="variant-name"
                  >
                    ${variant.name}
                  </div>

                  ${
                    variant.price

                      ? `
                        <div
                          class="variant-price"
                        >
                          ${variant.price} ₽
                        </div>
                      `

                      : ""
                  }

                </div>

              `
            )
            .join("")}

        </div>

      `;

    }


    productDetailsContent.innerHTML = `

      ${image}

      <div
        class="product-details-info"
      >

        <div
          class="product-details-name"
        >
          ${product.name}
        </div>

        ${price}

        ${description}

        ${variantsHTML}

        <button
          class="add-selection-button"
          id="addSelectionButton"
        >
          Добавить в мой выбор
        </button>

      </div>

    `;


    document
      .getElementById(
        "addSelectionButton"
      )
      .addEventListener(
        "click",
        () => {

          addToSelection(
            product
          );

        }
      );


    window.scrollTo(
      {
        top: 0,
        behavior: "smooth"
      }
    );


  } catch (error) {

    console.error(
      error
    );


    productDetailsContent.innerHTML = `

      <div
        class="product-details-info"
      >

        <div
          class="product-details-name"
        >
          ${product.name}
        </div>

        ${
          product.price

            ? `
              <div
                class="product-details-price"
              >
                ${product.price} ₽
              </div>
            `

            : ""
        }

        <div
          class="product-details-description"
        >
          ${
            product.description ||
            "Описание товара пока не добавлено."
          }
        </div>

        <button
          class="add-selection-button"
          id="addSelectionButton"
        >
          Добавить в мой выбор
        </button>

      </div>

    `;


    document
      .getElementById(
        "addSelectionButton"
      )
      .addEventListener(
        "click",
        () => {

          addToSelection(
            product
          );

        }
      );

  }

}


/* =========================
   ADD TO SELECTION
========================= */

function addToSelection(
  product
) {

  const existing =
    selectedItems.find(
      item =>
        String(item.id) ===
        String(product.id)
    );


  if (existing) {

    existing.quantity += 1;

  } else {

    selectedItems.push(
      {
        ...product,
        quantity: 1
      }
    );

  }


  updateSelectionCount();

}


/* =========================
   SELECTION COUNT
========================= */

function updateSelectionCount() {

  const count =
    selectedItems.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.quantity,
      0
    );


  selectionCount.textContent =
    count;

}


/* =========================
   RENDER SELECTION
========================= */

function renderSelection() {

  selectionItems.innerHTML =
    "";


  if (
    !selectedItems.length
  ) {

    selectionItems.innerHTML = `

      <div
        class="selection-empty"
      >
        Здесь пока ничего нет
      </div>

    `;


    selectionTotal.style.display =
      "none";


    return;

  }


  let total = 0;


  selectedItems.forEach(
    item => {

      const itemPrice =
        Number(item.price) ||
        0;


      total +=
        itemPrice *
        item.quantity;


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "selection-item";


      element.innerHTML = `

        ${
          item.image_url

            ? `
              <img
                class="selection-item-image"
                src="${item.image_url}"
                alt=""
              >
            `

            : `
              <div
                class="selection-item-image"
              ></div>
            `
        }


        <div
          class="selection-item-info"
        >

          <div
            class="selection-item-name"
          >
            ${item.name}
          </div>


          <div
            class="selection-item-price"
          >
            ${itemPrice} ₽
          </div>


          <div
            class="quantity"
          >

            <button
              data-action="minus"
            >
              −
            </button>


            <span
              class="quantity-value"
            >
              ${item.quantity}
            </span>


            <button
              data-action="plus"
            >
              +
            </button>

          </div>

        </div>


        <div
          class="remove-selection"
          data-action="remove"
        >
          Удалить
        </div>

      `;


      element
        .querySelector(
          '[data-action="minus"]'
        )
        .addEventListener(
          "click",
          () => {

            item.quantity -= 1;


            if (
              item.quantity <= 0
            ) {

              selectedItems =
                selectedItems.filter(
                  selected =>
                    String(
                      selected.id
                    ) !==
                    String(
                      item.id
                    )
                );

            }


            renderSelection();

            updateSelectionCount();

          }
        );


      element
        .querySelector(
          '[data-action="plus"]'
        )
        .addEventListener(
          "click",
          () => {

            item.quantity += 1;

            renderSelection();

            updateSelectionCount();

          }
        );


      element
        .querySelector(
          '[data-action="remove"]'
        )
        .addEventListener(
          "click",
          () => {

            selectedItems =
              selectedItems.filter(
                selected =>
                  String(
                    selected.id
                  ) !==
                  String(
                    item.id
                  )
              );


            renderSelection();

            updateSelectionCount();

          }
        );


      selectionItems
        .appendChild(
          element
        );

    }
  );


  selectionTotalValue.textContent =
    total + " ₽";


  selectionTotal.style.display =
    "flex";

}


/* =========================
   OPEN SELECTION
========================= */

selectionButton.addEventListener(
  "click",
  () => {

    catalogView.style.display =
      "none";

    productDetails.style.display =
      "none";

    selectionView.style.display =
      "block";


    renderSelection();


    window.scrollTo(
      {
        top: 0,
        behavior: "smooth"
      }
    );

  }
);


/* =========================
   BACK FROM SELECTION
========================= */

backFromSelection.addEventListener(
  "click",
  () => {

    selectionView.style.display =
      "none";

    catalogView.style.display =
      "block";


    window.scrollTo(
      {
        top: 0,
        behavior: "smooth"
      }
    );

  }
);


/* =========================
   BACK FROM PRODUCT
========================= */

backButton.addEventListener(
  "click",
  () => {

    productDetails.style.display =
      "none";

    catalogView.style.display =
      "block";


    window.scrollTo(
      {
        top: 0,
        behavior: "smooth"
      }
    );

  }
);


/* =========================
   START
========================= */

async function start() {

  try {

    await loadCategories();

    await loadProducts();


    statusElement.textContent =
      "● Online";


    statusElement.className =
      "status online";


  } catch (error) {

    console.error(
      error
    );


    statusElement.textContent =
      "Ошибка";


    statusElement.className =
      "status error";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "Не удалось подключиться к базе.\n\n" +
      error.message;

  }

}


start();

</script>

</body>
</html>
