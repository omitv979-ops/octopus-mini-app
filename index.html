<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCTOPUS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  padding: 25px 18px;
  max-width: 700px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
}

.status {
  font-size: 13px;
  color: #777;
}

.online {
  color: #55d98b;
}

.error {
  color: #ff6464;
}

h2 {
  font-size: 25px;
  margin-bottom: 18px;
}

section {
  margin-bottom: 40px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.category {
  padding: 12px 17px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 14px;
  white-space: nowrap;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product {
  background: #151515;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #222;
}

.product img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-info {
  padding: 13px;
}

.product-name {
  font-weight: 700;
}

.product-price {
  color: #999;
  margin-top: 6px;
}

.message {
  padding: 18px;
  border-radius: 15px;
  background: #151515;
  color: #777;
}

#errorBox {
  display: none;
  background: #1b0c0c;
  border: 1px solid #542020;
  color: #ff8b8b;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 25px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">OCTOPUS</div>
  <div id="status" class="status">Подключение...</div>
</header>

<div id="errorBox"></div>

<section>
  <h2>Категории</h2>
  <div id="categories" class="categories">
    <div class="message">Загрузка...</div>
  </div>
</section>

<section>
  <h2>Каталог</h2>
  <div id="products" class="products">
    <div class="message">Загрузка товаров...</div>
  </div>
</section>

</div>

<script>

const SUPABASE_URL = "https://fhnryfjpkbszbulxaytg.supabase.co";

const SUPABASE_KEY = "sb_publishable_OLxJGrlszfH6lhJrGcpocg_6Knr1yow";


const statusElement = document.getElementById("status");
const categoriesElement = document.getElementById("categories");
const productsElement = document.getElementById("products");
const errorBox = document.getElementById("errorBox");


async function supabaseRequest(table, query = "") {

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 8000);

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      "?" +
      query;

    const response = await fetch(url, {
      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },

      signal: controller.signal
    });

    if (!response.ok) {

      const text = await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );
    }

    return await response.json();

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error(
        "Supabase не ответил за 8 секунд."
      );
    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }
}


async function loadCategories() {

  try {

    const data = await supabaseRequest(
      "Categories",
      "select=*&is_active=eq.true&order=sort_order.asc"
    );

    categoriesElement.innerHTML = "";

    if (!data.length) {

      categoriesElement.innerHTML =
        '<div class="message">Категорий пока нет</div>';

      return;
    }

    data.forEach(category => {

      const element = document.createElement("div");

      element.className = "category";

      element.textContent = category.name;

      categoriesElement.appendChild(element);

    });

  } catch (error) {

    categoriesElement.innerHTML =
      '<div class="message">Не удалось загрузить категории</div>';

    throw error;
  }
}


async function loadProducts() {

  try {

    const data = await supabaseRequest(
      "Products",
      "select=*&is_active=eq.true&order=sort_order.asc"
    );

    productsElement.innerHTML = "";

    if (!data.length) {

      productsElement.innerHTML =
        '<div class="message">Товаров пока нет</div>';

      return;
    }

    data.forEach(product => {

      const card = document.createElement("div");

      card.className = "product";

      card.innerHTML = `

        ${
          product.image_url
          ? `<img src="${product.image_url}" alt="">`
          : ""
        }

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          ${
            product.price
            ? `<div class="product-price">${product.price} ₽</div>`
            : ""
          }

        </div>

      `;

      productsElement.appendChild(card);

    });

  } catch (error) {

    productsElement.innerHTML =
      '<div class="message">Не удалось загрузить каталог</div>';

    throw error;
  }
}


async function start() {

  try {

    await loadCategories();

    await loadProducts();

    statusElement.textContent = "● Online";
    statusElement.className = "status online";

  } catch (error) {

    console.error(error);

    statusElement.textContent = "Ошибка";
    statusElement.className = "status error";

    errorBox.style.display = "block";

    errorBox.textContent =
      "Не удалось подключиться к базе.\n\n" +
      error.message;

  }

}


start();

</script>

</body>
</html>
