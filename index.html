<title>OCTOPUS</title>

<style>
:root{
  --bg:#07070a;
  --surface:#111116;
  --surface2:#15151b;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{

    radial-gradient(420px 240px at 50% -90px,rgba(139,92,246,.22),transparent 72%),

}
.app{width:100%;max-width:760px;margin:0 auto;padding:0 14px 46px}
header{

  background:rgba(7,7,10,.84);
  border-bottom:1px solid rgba(255,255,255,.055);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)
}
.logo{font-size:31px;line-height:1;font-weight:950;letter-spacing:5px;color:#fff;text-shadow:0 0 28px rgba(139,92,246,.2)}
.status{font-size:13px;color:#8d8d99}.status.online{color:#a78bfa}.status.online:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:#9b6cff;box-shadow:0 0 12px #9b6cff}.status.error{color:#ff7777}
#errorBox{display:none;margin:0 0 16px;padding:13px 14px;border-radius:15px;background:#1b0b0f;border:1px solid #5a202b;color:#ff929f;font-size:13px;white-space:pre-wrap}
.cart-button{
  width:100%;height:60px;margin:0 0 30px;padding:0 17px;
  display:flex;align-items:center;justify-content:center;gap:10px;

.cart-button:after{content:"→";position:absolute;right:18px;color:#b9a3ff;font-size:28px;font-weight:400}

.section-title-row{display:flex;align-items:center;justify-content:space-between}
.catalog-search{
  width:100%;height:55px;margin:0 0 18px;padding:0 16px 0 47px;

.category.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#9869ff,#7441e9);box-shadow:0 8px 24px rgba(139,92,246,.22)}

.product-info{padding:14px 13px 13px}.product-name{min-height:38px;font-size:15px;line-height:1.25;font-weight:850}.product-price{margin-top:7px;color:#cbb9ff;font-size:17px;font-weight:900}

#productDetails,#cartView{display:none}

.product-details-image{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#0b0b0e}.product-details-info{padding:22px 19px 23px}.product-details-name{font-size:30px;line-height:1.05;letter-spacing:-.8px;font-weight:950}.product-details-price{margin:9px 0 17px;color:#cbb9ff;font-size:23px;font-weight:900}.product-details-description{color:#9999a5;font-size:14px;line-height:1.55;white-space:pre-wrap}
.variants-title{margin:24px 0 10px;font-size:17px;font-weight:850}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.variant{min-height:53px;padding:13px 14px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:#0d0d12;color:#fff;text-align:left}.variant.active{border-color:transparent;background:linear-gradient(135deg,#9464ff,#713fe5);box-shadow:0 8px 24px rgba(139,92,246,.2)}.variant-name{font-weight:750}.variant-price{margin-top:4px;color:#92929d;font-size:12px}.variant.active .variant-price{color:#eee}
.add-cart-button{width:100%;height:55px;margin-top:17px;border:0;border-radius:16px;background:linear-gradient(135deg,#9b6cff,#713fe5);color:#fff;font-size:15px;font-weight:900;box-shadow:0 12px 28px rgba(139,92,246,.22)}
.quantity-control{width:100%;height:55px;margin-top:17px;padding:5px;display:flex;align-items:center;justify-content:space-between;border-radius:16px;background:linear-gradient(135deg,#9b6cff,#713fe5);color:#fff}.quantity-control button{width:45px;height:45px;border:0;border-radius:13px;background:#101014;color:#fff;font-size:24px}.quantity-number{font-size:16px;font-weight:900}
#cartView h2{font-size:30px;margin:4px 0 17px}.cart-item{display:flex;align-items:center;gap:12px;padding:11px;margin-bottom:10px;border:1px solid var(--line);border-radius:19px;background:#121217}.cart-item-image{width:68px;height:68px;flex:0 0 68px;border-radius:14px;object-fit:cover;background:#0b0b0f}.cart-item-info{flex:1;min-width:0}.cart-item-name{margin-bottom:4px;font-size:14px;font-weight:850}.cart-item-price{color:#9999a5;font-size:13px}.cart-quantity{display:flex;align-items:center;gap:8px;margin-top:8px}.cart-quantity button{width:31px;height:31px;border:1px solid #303038;border-radius:10px;background:#0c0c10;color:#fff;font-size:18px}.cart-quantity-number{min-width:20px;text-align:center}.remove-item{padding:6px;color:#777;font-size:12px}.cart-total{display:flex;justify-content:space-between;margin-top:16px;padding:19px;border:1px solid rgba(139,92,246,.3);border-radius:19px;background:linear-gradient(110deg,rgba(139,92,246,.14),#121217);font-weight:900}.cart-empty{padding:28px 18px;text-align:center;border:1px solid var(--line);border-radius:17px;background:#101014;color:#777}.demo-order-button{width:100%;height:57px;margin-top:14px;border:0;border-radius:17px;background:linear-gradient(135deg,#9b6cff,#713fe5);color:#fff;font-size:16px;font-weight:900;box-shadow:0 14px 32px rgba(139,92,246,.22)}.order-created{padding:30px 20px;text-align:center;border:1px solid rgba(139,92,246,.3);border-radius:24px;background:linear-gradient(180deg,#17131f,#111)}.order-created-number{margin:12px 0 8px;color:#c7b4ff;font-size:31px;font-weight:950}.order-created-text{color:#999;line-height:1.5}
@media(max-width:420px){.app{padding-left:12px;padding-right:12px}header{margin-left:-12px;margin-right:-12px;padding-left:14px;padding-right:14px}.logo{font-size:27px;letter-spacing:4px}.products{gap:10px}.product{border-radius:20px}.product-info{padding:13px 11px 12px}.product-name{font-size:14px}.product-price{font-size:16px}}
</style>

</head>
<body>

<div class="app">

<header>
  <div class="logo">OCTOPUS</div>
  <div id="status" class="status">Подключение...</div>
</header>

<div id="errorBox"></div>

<div
  class="cart-button"
  id="cartButton"
>
  🛒  Корзина
  <span
    class="cart-count"
    id="cartCount"
  >
    0
  </span>
</div>


<!-- КАТАЛОГ -->

<div id="catalogView">

  <section>
    <div class="section-title-row">
      <h2>Каталог</h2>
    </div>
    <input id="catalogSearch" class="catalog-search" type="search" placeholder="Поиск товара…">
    <h2 style="margin-top:8px;">Категории</h2>

    <div
      id="categories"
      class="categories"
    >
      <div class="message">
        Загрузка...
      </div>
    </div>
  </section>

  <section>

    <div
      id="products"
      class="products"
    >
      <div class="message">
        Загрузка товаров...
      </div>

  </section>

</div>


<!-- КАРТОЧКА ТОВАРА -->

<div id="productDetails">

  <div
    class="back-button"

    ← Назад к каталогу

    class="back-button"

  >
    ← Назад к каталогу
  </div>

    id="cartTotal"

  >
    <span>Всего</span>

    <span id="cartTotalValue">
      0 ₽
    </span>
  </div>

  <button class="demo-order-button" id="demoOrderButton" type="button">
    Создать заказ
  </button>

</div>

</div>



<script>

const SUPABASE_URL =
  "https://fhnryfjpkbszbulxaytg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OLxJGrlszfH6lhJrGcpocg_6Knr1yow";


const statusElement =
  document.getElementById("status");

const categoriesElement =
  document.getElementById("categories");

const productsElement =
  document.getElementById("products");

const errorBox =
  document.getElementById("errorBox");

const catalogView =
  document.getElementById("catalogView");

const productDetails =
  document.getElementById("productDetails");

const productDetailsContent =
  document.getElementById(
    "productDetailsContent"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const cartButton =
  document.getElementById(
    "cartButton"
  );

const cartCount =
  document.getElementById(
    "cartCount"
  );

const cartView =
  document.getElementById(
    "cartView"
  );

const backFromCart =
  document.getElementById(
    "backFromCart"
  );

const cartItems =
  document.getElementById(
    "cartItems"
  );

const cartTotal =
  document.getElementById(
    "cartTotal"
  );

const cartTotalValue =
  document.getElementById(
    "cartTotalValue"
  );


let allProducts = [];

let currentCategory = null;

let cart = [];

let currentProduct = null;

let currentVariants = [];

let selectedVariant = null;
let productSearchQuery = "";


/* =========================
   SUPABASE
========================= */

async function supabaseRequest(
  table,
  query = ""
) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 8000);

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      "?" +
      query;


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          signal:
            controller.signal
        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );

    }


    return await response.json();


  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      throw new Error(
        "Supabase не ответил за 8 секунд."
      );

    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }

}


/* =========================
   КАТЕГОРИИ
========================= */

async function loadCategories() {

  try {

    const data =
      await supabaseRequest(
        "Categories",
        "select=*&is_active=eq.true&order=sort_order.asc"
      );


    categoriesElement.innerHTML =
      "";


    if (!data.length) {

      categoriesElement.innerHTML =
        '<div class="message">Категорий пока нет</div>';

      return;

    }


    const allButton =
      document.createElement("div");

    allButton.className =
      "category active";

    allButton.textContent =
      "Все";


    allButton.addEventListener(
      "click",
      () => {

        currentCategory =
          null;

        document
          .querySelectorAll(
            ".category"
          )
          .forEach(
            button => {
              button.classList
                .remove("active");
            }
          );

        allButton.classList
          .add("active");

        renderProducts(
          allProducts
        );

      }
    );


    categoriesElement
      .appendChild(
        allButton
      );


    data.forEach(
      category => {

        const element =
          document.createElement(
            "div"
          );

        element.className =
          "category";

        element.textContent =
          category.name;


        element.addEventListener(
          "click",
          () => {

            currentCategory =
              category.id;


            document
              .querySelectorAll(
                ".category"
              )
              .forEach(
                button => {
                  button.classList
                    .remove("active");
                }
              );


            element.classList
              .add("active");


            const filteredProducts =
              allProducts.filter(
                product => {

                  return String(
                    product.category_id
                  ) === String(
                    category.id
                  );

                }
              );


            renderProducts(
              filteredProducts
            );

          }
        );


        categoriesElement
          .appendChild(
            element
          );

      }
    );


  } catch (error) {

    categoriesElement.innerHTML =
      '<div class="message">Не удалось загрузить категории</div>';

    throw error;

  }

}


/* =========================
   ТОВАРЫ
========================= */

async function loadProducts() {

  try {

    const data =
      await supabaseRequest(
        "Products",
        "select=*&is_active=eq.true&order=sort_order.asc"
      );


    allProducts =
      data;


    renderProducts(
      data
    );


  } catch (error) {

    productsElement.innerHTML =
      '<div class="message">Не удалось загрузить каталог</div>';

    throw error;

  }

}


/* =========================
   КАТАЛОГ
========================= */

function renderProducts(
  data
) {

  productsElement.innerHTML =
    "";

  const query = productSearchQuery.trim().toLowerCase();

  const visibleData = query
    ? data.filter(product =>
        String(product.name || "")
          .toLowerCase()
          .includes(query)
      )
    : data;


  if (!data.length) {

    productsElement.innerHTML =
      '<div class="message">В этой категории товаров пока нет</div>';

    return;

  }


  visibleData.forEach(
    product => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "product";


      const image =
        product.image_url
          ? `
            <img
              src="${product.image_url}"
              alt=""
            >
          `
          : "";


      const price =
        product.price
          ? `
            <div
              class="product-price"
            >
              ${product.price} ₽
            </div>
          `
          : "";


      card.innerHTML = `

        ${image}

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          ${price}

          <button class="product-select-btn">
            Выбрать
          </button>

        </div>

      `;


      card.addEventListener(
        "click",
        () => {
          openProduct(
            product
          );
        }
      );


      productsElement
        .appendChild(card);

    }
  );

}


/* =========================
   ОТКРЫТЬ ТОВАР
========================= */

async function openProduct(
  product
) {

  currentProduct = product;
  selectedVariant = null;
  currentVariants = [];

  catalogView.style.display = "none";
  cartView.style.display = "none";
  productDetails.style.display = "block";

  productDetailsContent.innerHTML =
    '<div class="message">Загрузка товара...</div>';

  try {
    const variants = await supabaseRequest(
      "product_variants",
      "select=*&product_id=eq." + encodeURIComponent(product.id) +
      "&is_active=eq.true&order=sort_order.asc"
    );

    currentVariants = variants || [];

    const image = product.image_url
      ? `<img class="product-details-image" src="${product.image_url}" alt="">`
      : "";

    const description = product.description
      ? `<div class="product-details-description">${product.description}</div>`
      : `<div class="product-details-description">Описание товара пока не добавлено.</div>`;

    let variantsHTML = "";

    if (currentVariants.length) {
      variantsHTML = `
        <div class="variants-title">Вкусы</div>
        <div class="variants" id="variantsList">
          ${currentVariants.map((variant, index) => `
            <button class="variant" type="button" data-variant-index="${index}">
              <div class="variant-name">${variant.name}</div>
              ${variant.price ? `<div class="variant-price">${variant.price} ₽</div>` : ""}
            </button>
          `).join("")}
        </div>
      `;
    }

    const basePrice = Number(product.price) || 0;
    const shownPrice = currentVariants.length ? "Выберите вкус" : `${basePrice} ₽`;

    productDetailsContent.innerHTML = `
      ${image}
      <div class="product-details-info">
        <div class="product-details-name">${product.name}</div>
        <div class="product-details-price" id="productCurrentPrice">${shownPrice}</div>
        ${description}
        ${variantsHTML}
        <div id="productCartControl"></div>
      </div>
    `;

    if (currentVariants.length) {
      document.querySelectorAll("[data-variant-index]").forEach(button => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.variantIndex);
          selectedVariant = currentVariants[index];

          document.querySelectorAll("[data-variant-index]").forEach(item => {
            item.classList.remove("active");
          });
          button.classList.add("active");

          const selectedPrice = Number(selectedVariant.price) || basePrice;
          document.getElementById("productCurrentPrice").textContent = `${selectedPrice} ₽`;
          renderProductCartControl();
        });
      });
    }

    renderProductCartControl();

    window.scrollTo({ top: 0, behavior: "smooth" });

  } catch (error) {
    console.error(error);
    productDetailsContent.innerHTML = `
      <div class="product-details-info">
        <div class="product-details-name">${product.name}</div>
        ${product.price ? `<div class="product-details-price">${product.price} ₽</div>` : ""}
        <div class="product-details-description">${product.description || "Описание товара пока не добавлено."}</div>
        <div id="productCartControl"></div>
      </div>
    `;
    renderProductCartControl();
  }
}

function getCartKey(productId, variantId = null) {
  return String(productId) + "::" + (variantId === null ? "base" : String(variantId));
}

function getSelectedPrice(product, variant = null) {
  if (variant && Number(variant.price)) return Number(variant.price);
  return Number(product.price) || 0;
}

/* =========================
   КНОПКА / КОЛИЧЕСТВО
========================= */

function getCartQuantity(productId, variantId = null) {
  const key = getCartKey(productId, variantId);
  const item = cart.find(item => item.cartKey === key);
  return item ? item.quantity : 0;
}

function renderProductCartControl() {
  const container = document.getElementById("productCartControl");
  if (!container || !currentProduct) return;

  if (currentVariants.length && !selectedVariant) {
    container.innerHTML = `
      <button class="add-cart-button" disabled style="opacity:.45;cursor:not-allowed;">
        Сначала выберите вкус
      </button>
    `;
    return;
  }

  const variantId = selectedVariant ? selectedVariant.id : null;
  const quantity = getCartQuantity(currentProduct.id, variantId);

  if (quantity === 0) {
    container.innerHTML = `
      <button class="add-cart-button" id="addCartButton">Добавить в корзину</button>
    `;

    document.getElementById("addCartButton").addEventListener("click", () => {
      addToCart(currentProduct, selectedVariant);
    });
    return;
  }

  container.innerHTML = `
    <div class="quantity-control">
      <button id="minusProduct">−</button>
      <span class="quantity-number">В корзине: ${quantity}</span>
      <button id="plusProduct">+</button>
    </div>
  `;

  document.getElementById("minusProduct").addEventListener("click", () => {
    changeCartQuantity(currentProduct.id, -1, variantId);
  });

  document.getElementById("plusProduct").addEventListener("click", () => {
    changeCartQuantity(currentProduct.id, 1, variantId);
  });
}

function addToCart(product, variant = null) {
  const variantId = variant ? variant.id : null;
  const cartKey = getCartKey(product.id, variantId);
  const existing = cart.find(item => item.cartKey === cartKey);

  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      ...product,
      quantity: 1,
      cartKey,
      variantId,
      variantName: variant ? variant.name : null,
      variantPrice: getSelectedPrice(product, variant)
    });
  }

  updateCartCount();
  renderProductCartControl();
}

/* =========================
   ИЗМЕНИТЬ КОЛИЧЕСТВО
========================= */

function changeCartQuantity(productId, amount, variantId = null) {
  const cartKey = getCartKey(productId, variantId);
  const item = cart.find(item => item.cartKey === cartKey);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.cartKey !== cartKey);
  }

  updateCartCount();
  renderProductCartControl();
}

/* =========================
   СЧЁТЧИК КОРЗИНЫ
========================= */

function updateCartCount() {

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        item.quantity,
      0
    );


  cartCount.textContent =
    count;

}


/* =========================
   ОТРИСОВКА КОРЗИНЫ
========================= */

function renderCart() {
  cartItems.innerHTML = "";

  if (!cart.length) {
    cartItems.innerHTML = `<div class="cart-empty">Корзина пока пуста</div>`;
    cartTotal.style.display = "none";
    return;
  }

  let total = 0;

  cart.forEach(item => {
    const price = Number(item.variantPrice ?? item.price) || 0;
    total += price * item.quantity;

    const element = document.createElement("div");
    element.className = "cart-item";

    element.innerHTML = `
      ${item.image_url ? `<img class="cart-item-image" src="${item.image_url}" alt="">` : `<div class="cart-item-image"></div>`}
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        ${item.variantName ? `<div class="cart-item-price">Вкус: ${item.variantName}</div>` : ""}
        <div class="cart-item-price">${price} ₽</div>
        <div class="cart-quantity">
          <button data-action="minus">−</button>
          <span class="cart-quantity-number">${item.quantity}</span>
          <button data-action="plus">+</button>
        </div>
      </div>
      <div class="remove-item" data-action="remove">Удалить</div>
    `;

    element.querySelector('[data-action="minus"]').addEventListener("click", () => {
      changeCartQuantity(item.id, -1, item.variantId);
      renderCart();
    });

    element.querySelector('[data-action="plus"]').addEventListener("click", () => {
      changeCartQuantity(item.id, 1, item.variantId);
      renderCart();
    });

    element.querySelector('[data-action="remove"]').addEventListener("click", () => {
      cart = cart.filter(selected => selected.cartKey !== item.cartKey);
      updateCartCount();
      renderCart();
    });

    cartItems.appendChild(element);
  });

  cartTotalValue.textContent = total + " ₽";
  cartTotal.style.display = "flex";
}

/* =========================
   ДЕМО-ЗАКАЗ
========================= */

function getDemoOrders() {
  try {
    return JSON.parse(localStorage.getItem("octopus_demo_orders_v1") || "[]");
  } catch (error) {
    return [];
  }
}

function saveDemoOrders(orders) {
  localStorage.setItem("octopus_demo_orders_v1", JSON.stringify(orders));
}

function generateDemoOrderNumber() {
  const orders = getDemoOrders();

  const numbers = orders
    .map(order => Number(order.number))
    .filter(number => Number.isFinite(number) && number > 0);

  return String(Math.max(0, ...numbers) + 1);
}
function createDemoOrder() {
  if (!cart.length) return;

  const order = {
    number: generateDemoOrderNumber(),
    status: "Новый",
    createdAt: new Date().toLocaleString("ru-RU"),
    items: cart.map(item => ({
      name: item.name,
      variant: item.variantName || "",
      qty: item.quantity,
      price: Number(item.variantPrice ?? item.price) || 0
    }))
  };

  const orders = getDemoOrders();
  orders.push(order);
  saveDemoOrders(orders);

  cart = [];
  updateCartCount();

  cartItems.innerHTML = `
    <div class="order-created">
      <div>Заказ создан</div>
      <div class="order-created-number">№ ${order.number}</div>
      <div class="order-created-text">
        Заказ сохранён.<br>
        Его состав доступен в разделе «Заказы» админки.
      </div>
    </div>
  `;

  cartTotal.style.display = "none";
  const button = document.getElementById("demoOrderButton");
  if (button) button.style.display = "none";
}

const demoOrderButton = document.getElementById("demoOrderButton");

if (demoOrderButton) {
  demoOrderButton.addEventListener("click", createDemoOrder);
}
