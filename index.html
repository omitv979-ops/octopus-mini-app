<style>
html, body {
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  padding: 25px 18px;
  max-width: 700px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
}

.status {
  font-size: 13px;
  color: #777;
}

.online {
  color: #55d98b;
}

.error {
  color: #ff6464;
}

h2 {
  font-size: 25px;
  margin-bottom: 18px;
}

section {
  margin-bottom: 40px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  padding: 12px 17px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 14px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

.category:hover {
  background: #202020;
}

.category.active {
  background: white;
  color: #090909;
  border-color: white;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product {
  background: #151515;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #222;
  cursor: pointer;
  transition: 0.15s;
}

.product:active {
  transform: scale(0.98);
}

.product img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-info {
  padding: 13px;
}

.product-name {
  font-weight: 700;
}

.product-price {
  color: #999;
  margin-top: 6px;
}

.message {
  padding: 18px;
  border-radius: 15px;
  background: #151515;
  color: #777;
}

#errorBox {
  display: none;
  background: #1b0c0c;
  border: 1px solid #542020;
  color: #ff8b8b;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 25px;
  white-space: pre-wrap;
}


/* КОРЗИНА */

.cart-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 15px;
  margin-bottom: 25px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 13px;
  color: white;
  cursor: pointer;
  user-select: none;
}

.cart-count {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: white;
  color: #090909;
  font-size: 12px;
  font-weight: 800;
}


/* КАРТОЧКА ТОВАРА */

#productDetails {
  display: none;
}

.back-button {
  display: inline-block;
  padding: 11px 16px;
  margin-bottom: 25px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 13px;
  color: white;
  cursor: pointer;
}

.product-details-card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 22px;
  overflow: hidden;
}

.product-details-image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.product-details-info {
  padding: 20px;
}

.product-details-name {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 10px;
}

.product-details-price {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
}

.product-details-description {
  color: #aaa;
  line-height: 1.55;
  white-space: pre-wrap;
}


/* ВАРИАНТЫ */
.variants-title {
  font-size: 20px;
  font-weight: 700;
  margin-top: 25px;
  margin-bottom: 12px;
}

.variants {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.variant {
  padding: 13px 15px;
  background: #090909;
  border: 1px solid #292929;
  border-radius: 13px;
  color: white;
  text-align: left;
  cursor: pointer;
}

.variant.active {
  background: white;
  color: #090909;
  border-color: white;
}

.variant-name {
  font-weight: 600;
}

.variant-price {
  color: #aaa;
  margin-top: 4px;
  font-size: 13px;
}

.variant.active .variant-price {
  color: #555;
}


/* ДОБАВЛЕНИЕ В КОРЗИНУ */

.add-cart-button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  background: white;
  color: #090909;
  border: 0;
  border-radius: 13px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
}

.quantity-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: 20px;
  padding: 5px;
  background: white;
  color: #090909;
  border-radius: 13px;
}

.quantity-control button {
  width: 44px;
  height: 42px;
  border: 0;
  border-radius: 10px;
  background: #090909;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.quantity-number {
  font-size: 17px;
  font-weight: 800;
}


/* КОРЗИНА */

#cartView {
  display: none;
}

.cart-item {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 13px;
  margin-bottom: 10px;
  background: #151515;
  border: 1px solid #222;
  border-radius: 16px;
}

.cart-item-image {
  width: 70px;
  height: 70px;
  flex: 0 0 70px;
  border-radius: 12px;
  object-fit: cover;
  background: #090909;
}

.cart-item-info {
  flex: 1;
  min-width: 0;
}

.cart-item-name {
  font-weight: 700;
  margin-bottom: 5px;
}

.cart-item-price {
  color: #999;
  font-size: 14px;
}

.cart-quantity {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
}

.cart-quantity button {
  width: 30px;
  height: 30px;
  border: 1px solid #333;
  border-radius: 9px;
  background: #090909;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.cart-quantity-number {
  min-width: 20px;
  text-align: center;
}

.remove-item {
  padding: 7px;
  color: #777;
  cursor: pointer;
  font-size: 13px;
}

.cart-empty {
  padding: 25px 18px;
  text-align: center;
  border-radius: 16px;
  background: #151515;
  color: #777;
}

.cart-total {
  margin-top: 18px;
  padding: 18px;
  border-radius: 16px;
  background: #151515;
  border: 1px solid #222;
  display: flex;
  justify-content: space-between;
  font-weight: 800;
}

(function () {

  document.addEventListener('touchend', function (event) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (eventName) {
    document.addEventListener(eventName, function (event) {
      event.preventDefault();
    }, { passive: false });
  });
})();
</script>

async function supabaseRequest(
  table,
  query = ""
) {

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {
      controller.abort();
    }, 8000);

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      "?" +
      query;


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          },

          signal:
            controller.signal
        }
      );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );

    }


    return await response.json();


  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      throw new Error(
        "Supabase не ответил за 8 секунд."
      );

    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }

}

      `;
    }

    const basePrice = Number(product.price) || 0;
    const shownPrice = currentVariants.length ? "Выберите вкус" : `${basePrice} ₽`;

    productDetailsContent.innerHTML = `
      ${image}
      <div class="product-details-info">
        <div class="product-details-name">${product.name}</div>
        <div class="product-details-price" id="productCurrentPrice">${shownPrice}</div>
        ${description}
        ${variantsHTML}
        <div id="productCartControl"></div>
      </div>
    `;

    if (currentVariants.length) {
      document.querySelectorAll("[data-variant-index]").forEach(button => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.variantIndex);
          selectedVariant = currentVariants[index];

          document.querySelectorAll("[data-variant-index]").forEach(item => {
            item.classList.remove("active");
          });
          button.classList.add("active");

          const selectedPrice = Number(selectedVariant.price) || basePrice;
          document.getElementById("productCurrentPrice").textContent = `${selectedPrice} ₽`;
          renderProductCartControl();
        });
      });
    }

    renderProductCartControl();

    window.scrollTo({ top: 0, behavior: "smooth" });

  } catch (error) {
    console.error(error);
    productDetailsContent.innerHTML = `
      <div class="product-details-info">
        <div class="product-details-name">${product.name}</div>
        ${product.price ? `<div class="product-details-price">${product.price} ₽</div>` : ""}
        <div class="product-details-description">${product.description || ""}</div>
        <div id="productCartControl"></div>
      </div>
    `;
    renderProductCartControl();
  }
}

function getCartKey(productId, variantId = null) {
  return String(productId) + "::" + (variantId === null ? "base" : String(variantId));
}

function getSelectedPrice(product, variant = null) {
  if (variant && Number(variant.price)) return Number(variant.price);
  return Number(product.price) || 0;
}

/* =========================
   КНОПКА / КОЛИЧЕСТВО
========================= */

function getCartQuantity(productId, variantId = null) {
  const key = getCartKey(productId, variantId);
  const item = cart.find(item => item.cartKey === key);
  return item ? item.quantity : 0;
}

function renderProductCartControl() {
  const container = document.getElementById("productCartControl");
  if (!container || !currentProduct) return;

  if (currentVariants.length && !selectedVariant) {
    container.innerHTML = `
      <button class="add-cart-button" disabled style="opacity:.45;cursor:not-allowed;">
        Сначала выберите вкус
      </button>
    `;
    return;
  }

  const variantId = selectedVariant ? selectedVariant.id : null;
  const quantity = getCartQuantity(currentProduct.id, variantId);

  if (quantity === 0) {
    container.innerHTML = `
      <button class="add-cart-button" id="addCartButton">Добавить в корзину</button>
    `;

    document.getElementById("addCartButton").addEventListener("click", () => {
      addToCart(currentProduct, selectedVariant);
    });
    return;
  }

  container.innerHTML = `
    <div class="quantity-control">
      <button id="minusProduct">−</button>
      <span class="quantity-number">В корзине: ${quantity}</span>
      <button id="plusProduct">+</button>
    </div>
  `;

  document.getElementById("minusProduct").addEventListener("click", () => {
    changeCartQuantity(currentProduct.id, -1, variantId);
  });

  document.getElementById("plusProduct").addEventListener("click", () => {
    changeCartQuantity(currentProduct.id, 1, variantId);
  });
}

function addToCart(product, variant = null) {
  const variantId = variant ? variant.id : null;
  const cartKey = getCartKey(product.id, variantId);
  const existing = cart.find(item => item.cartKey === cartKey);

  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({
      ...product,
      quantity: 1,
      cartKey,
      variantId,
      variantName: variant ? variant.name : null,
      variantPrice: getSelectedPrice(product, variant)
    });
  }

  updateCartCount();
  renderProductCartControl();
}

/* =========================
   ИЗМЕНИТЬ КОЛИЧЕСТВО
========================= */

function changeCartQuantity(productId, amount, variantId = null) {
  const cartKey = getCartKey(productId, variantId);
  const item = cart.find(item => item.cartKey === cartKey);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.cartKey !== cartKey);
  }

  updateCartCount();
  renderProductCartControl();
}

/* =========================
   СЧЁТЧИК КОРЗИНЫ
========================= */

function updateCartCount() {

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        item.quantity,
      0
    );


  cartCount.textContent =
    count;

}


/* =========================
   ОТРИСОВКА КОРЗИНЫ
========================= */

function renderCart() {
  cartItems.innerHTML = "";

  if (!cart.length) {
    cartItems.innerHTML = `<div class="cart-empty">Корзина пока пуста</div>`;
    cartTotal.style.display = "none";
    return;
  }

  let total = 0;

  cart.forEach(item => {
    const price = Number(item.variantPrice ?? item.price) || 0;
    total += price * item.quantity;

    const element = document.createElement("div");
    element.className = "cart-item";

    element.innerHTML = `
      ${item.image_url ? `<img class="cart-item-image" src="${item.image_url}" alt="">` : `<div class="cart-item-image"></div>`}
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        ${item.variantName ? `<div class="cart-item-price">Вкус: ${item.variantName}</div>` : ""}
        <div class="cart-item-price">${price} ₽</div>
        <div class="cart-quantity">
          <button data-action="minus">−</button>
          <span class="cart-quantity-number">${item.quantity}</span>
          <button data-action="plus">+</button>
        </div>
      </div>
      <div class="remove-item" data-action="remove">Удалить</div>
    `;

    element.querySelector('[data-action="minus"]').addEventListener("click", () => {
      changeCartQuantity(item.id, -1, item.variantId);
      renderCart();
    });

    element.querySelector('[data-action="plus"]').addEventListener("click", () => {
      changeCartQuantity(item.id, 1, item.variantId);
      renderCart();
    });

    element.querySelector('[data-action="remove"]').addEventListener("click", () => {
      cart = cart.filter(selected => selected.cartKey !== item.cartKey);
      updateCartCount();
      renderCart();
    });

    cartItems.appendChild(element);
  });

  cartTotalValue.textContent = total + " ₽";
  cartTotal.style.display = "flex";
}

/* =========================
   ОТКРЫТЬ КОРЗИНУ
========================= */

cartButton.addEventListener(

    catalogView.style.display =

const catalogSearch =
  document.getElementById("catalogSearch");

if (catalogSearch) {
  catalogSearch.addEventListener("input", () => {

      : allProducts.filter(
          product => Number(product.category_id) === Number(currentCategory)
        );

========================= */

async function start() {

  try {

    await loadCategories();

    await loadProducts();


    statusElement.textContent =
      "● Online";

    statusElement.className =
      "status online";


  } catch (error) {

    console.error(
      error
    );


    statusElement.textContent =
      "Ошибка";

    statusElement.className =
      "status error";


    errorBox.style.display =
      "block";


    errorBox.textContent =
      "Не удалось подключиться к базе.\n\n" +
      error.message;

  }

}


start();
